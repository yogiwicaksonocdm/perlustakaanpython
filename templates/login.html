{% extends "base.html" %}
{% block title %}Masuk - Perpustakaan Digital{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-xl shadow-md mt-6 md:mt-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">🔐 Masuk</h1>
    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">Email</label>
            <input type="email" name="email" required class="w-full p-2 border rounded mt-1 focus:outline-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Password</label>
            <input type="password" name="password" required class="w-full p-2 border rounded mt-1 focus:outline-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition">
            Masuk
        </button>
    </form>
    <p class="text-sm text-slate-600 mt-4 text-center">
        Belum punya akun? <a href="/register" class="text-blue-600 hover:underline">Daftar anggota</a>
    </p>
</div>
{% endblock %}
