<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Perpustakaan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-3xl font-bold text-slate-800 mb-6">📚 Perpustakaan Digital</h1>

        <!-- Form Tambah Buku -->
        <form action="/add" method="POST" class="grid grid-cols-1 md:grid-cols-5 gap-3 mb-8 bg-slate-50 p-4 rounded-lg border">
            <input type="text" name="title" placeholder="Judul Buku" required class="p-2 border rounded focus:outline-blue-500">
            <input type="text" name="author" placeholder="Penulis" required class="p-2 border rounded focus:outline-blue-500">
            <input type="number" name="year" placeholder="Tahun Terbit" class="p-2 border rounded focus:outline-blue-500">
            <input type="text" name="isbn" placeholder="ISBN" class="p-2 border rounded focus:outline-blue-500">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition">
                + Tambah Buku
            </button>
        </form>

        <!-- Tabel Daftar Buku -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-white">
                        <th class="p-3 border">Judul</th>
                        <th class="p-3 border">Penulis</th>
                        <th class="p-3 border">Tahun</th>
                        <th class="p-3 border">ISBN</th>
                        <th class="p-3 border">Status</th>
                        <th class="p-3 border text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for book in books %}
                    <tr class="hover:bg-slate-50 border-b">
                        <td class="p-3 font-semibold text-slate-700">{{ book.title }}</td>
                        <td class="p-3 text-slate-600">{{ book.author }}</td>
                        <td class="p-3 text-slate-600">{{ book.year }}</td>
                        <td class="p-3 text-slate-600">{{ book.isbn or '-' }}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 text-xs rounded-full {{ 'bg-green-100 text-green-800' if book.status == 'Tersedia' else 'bg-amber-100 text-amber-800' }}">
                                {{ book.status }}
                            </span>
                        </td>
                        <td class="p-3 text-center space-x-2">
                            <a href="/edit/{{ book.id }}" class="text-blue-600 hover:underline">Edit</a>
                            <a href="/delete/{{ book.id }}" onclick="return confirm('Yakin ingin menghapus?')" class="text-red-600 hover:underline">Hapus</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6" class="p-4 text-center text-slate-500">Belum ada data buku. Silakan tambahkan!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
