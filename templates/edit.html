{% extends "base.html" %}
{% block title %}Edit Buku - Perpustakaan Digital{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 sm:p-8 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">✏️ Edit Data Buku</h1>

    <form action="/edit/{{ book.id }}" method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">Judul Buku</label>
            <input type="text" name="title" value="{{ book.title }}" required class="w-full p-2 border rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Penulis</label>
            <input type="text" name="author" value="{{ book.author }}" required class="w-full p-2 border rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Kategori</label>
            <input type="text" name="category" value="{{ book.get('category', '') }}" placeholder="Mis. Novel, Sains, Sejarah" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Cover Buku</label>
            {% if book.cover_data %}
            <img src="{{ book.cover_data }}" alt="Cover saat ini" class="w-20 h-28 object-cover rounded shadow mt-1">
            {% elif book.cover_url %}
            <img src="{{ book.cover_url }}" alt="Cover saat ini" class="w-20 h-28 object-cover rounded shadow mt-1">
            {% else %}
            <div class="w-20 h-28 rounded bg-slate-200 flex items-center justify-center mt-1 text-2xl">📕</div>
            {% endif %}

            <label class="block text-xs text-slate-500 mt-3">Ganti cover (PNG/JPG/WebP/GIF, maks. 500 KB)</label>
            <input type="file" name="cover" accept="image/png,image/jpeg,image/webp,image/gif" class="w-full p-2 border rounded mt-1 text-sm">

            <label class="block text-xs text-slate-500 mt-3">Atau isi URL gambar cover</label>
            <input type="text" name="cover_url" value="{{ book.cover_url or '' }}" placeholder="https://contoh.com/cover.jpg" class="w-full p-2 border rounded mt-1 text-sm">

            <label class="inline-flex items-center gap-2 mt-2 text-sm text-slate-700">
                <input type="checkbox" name="remove_cover" value="1" class="rounded">
                Hapus cover saat ini
            </label>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Tahun Terbit</label>
            <input type="number" name="year" value="{{ book.year }}" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">ISBN</label>
            <input type="text" name="isbn" value="{{ book.isbn }}" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Jumlah Stok</label>
            <input type="number" name="stock" value="{{ book.get('stock', 0) }}" min="0" class="w-full p-2 border rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Status</label>
            <select name="status" class="w-full p-2 border rounded mt-1">
                <option value="Tersedia" {{ 'selected' if book.status == 'Tersedia' }}>Tersedia</option>
                <option value="Dipinjam" {{ 'selected' if book.status == 'Dipinjam' }}>Dipinjam</option>
            </select>
        </div>

        <div class="flex justify-between items-center pt-4">
            <a href="/" class="text-slate-600 hover:underline">Batal</a>
            <button type="submit" class="bg-blue-600 text-white font-semibold py-2 px-6 rounded hover:bg-blue-700">
                Simpan Perubahan
            </button>
        </div>
    </form>
</div>
{% endblock %}
